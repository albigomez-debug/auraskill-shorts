name: Generar voz (shorts animados)

on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Carpeta(s) con texto.txt, separadas por espacios (p. ej. animados/melaza animados/oso)"
        required: true
      voz:
        description: "Voz de edge-tts"
        default: "es-ES-AlvaroNeural"
      velocidad:
        description: "Velocidad"
        default: "+10%"

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts
          for c in ${{ github.event.inputs.carpeta }}; do python herramientas/voz.py "$c" "${{ github.event.inputs.voz }}" "${{ github.event.inputs.velocidad }}"; done
      - run: |
          git config user.name "auraskill-bot"
          git config user.email "auraskill-bot@users.noreply.github.com"
          git add ${{ github.event.inputs.carpeta }}
          git diff --cached --quiet && exit 0
          git commit -m "Voz generada"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
